# Local Postgres for development — matches DATABASE_URL in .env.example.
# `docker compose up -d` → `npx prisma migrate deploy` → `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abetflow
      POSTGRES_PASSWORD: abetflow
      POSTGRES_DB: abetflow
    ports:
      - "5432:5432"
    volumes:
      - abetflow-pg:/var/lib/postgresql/data

volumes:
  abetflow-pg:
